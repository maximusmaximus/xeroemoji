[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xeroemoji"
version = "1.0.0"
description = "Xero Emoji lookup + MCP server: 3,963 Unicode Emoji 18.0 emoji -> SVG/PNG URLs, names, groups, skin tones (no dependencies)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Max Infeld" }]
license = { text = "Code: see repository. Artwork: CC BY-NC 4.0; commercial license available" }
keywords = ["emoji", "svg", "unicode", "emoji-font", "mcp"]
urls = { Homepage = "https://maximusmaximus.github.io/xeroemoji/", Source = "https://github.com/maximusmaximus/xeroemoji" }

[project.scripts]
xeroemoji = "xeroemoji.__main__:main"
xeroemoji-mcp = "xeroemoji.mcp_server:serve"

[tool.setuptools]
packages = ["xeroemoji"]

[tool.setuptools.package-data]
xeroemoji = ["emoji-map.json"]
